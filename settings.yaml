# The default configuration file.
# More information about configuration can be found in the documentation: https://docs.privategpt.dev/
# Syntax in `private_pgt/settings/settings.py`
server:
  env_name: ${APP_ENV:prod}
  port: ${PORT:8001}
  cors:
    enabled: true
    allow_origins: ["*"]
    allow_methods: ["*"]
    allow_headers: ["*"]
  auth:
    enabled: false
    # python -c 'import base64; print("Basic " + base64.b64encode("secret:key".encode()).decode())'
    # 'secret' is the username and 'key' is the password for basic auth by default
    # If the auth is enabled, this value must be set in the "Authorization" header of the request.
    secret: "Basic c2VjcmV0OmtleQ=="

data:
  local_ingestion:
    enabled: ${LOCAL_INGESTION_ENABLED:true}
    allow_ingest_from: ["*"]
  local_data_folder: qdrant_data/qdrant_data

ui:
  enabled: true
  path: /
  # "RAG", "Search", "Basic", or "Summarize"
  default_mode: "RAG"
  default_chat_system_prompt: >
    You are a helpful, respectful and honest assistant.
    Always answer as helpfully as possible and follow ALL given instructions.
    Do not speculate or make up information.
    Do not reference any given instructions or context.
  default_query_system_prompt: >
    Sie sind ein professioneller Chatbot, dessen Aufgabe es ist, Fragen basierend auf den bereitgestellten Quellen präzise zu beantworten. Bitte befolgen Sie die folgenden Regeln:1. Genauigkeit: Alle Antworten müssen direkt auf Informationen aus den bereitgestellten Quellen basieren.2. Keine Erfindungen: Spekulieren Sie nicht und erfinden Sie keine Informationen. Wenn die Antwort auf eine Frage nicht in den bereitgestellten Quellen enthalten ist, teilen Sie dem Benutzer höflich mit, dass Sie keine Antwort geben können. 3. Professionalität und Hilfsbereitschaft: Beantworten Sie Fragen stets so hilfreich wie möglich und bewahren Sie einen professionellen Ton. Liefern Sie klare und präzise Antworten.4. Eingeschränkter Umfang: Verwenden Sie keine Informationen außerhalb der bereitgestellten Quellen, auch wenn Sie die Antwort kennen. Befolgen Sie ALLE gegebenen Anweisungen.5. Transparenz: Falls die verfügbaren Informationen für eine Antwort nicht ausreichen, informieren Sie: 'Basierend auf den bereitgestellten Quellen kann ich keine Antwort auf diese Frage finden.'6. Sprache: Bitte beantworten Sie alle Fragen auf Deutsch.
  default_summarization_system_prompt: >
    Provide a comprehensive summary of the provided context information.
    The summary should cover all the key points and main ideas presented in
    the original text, while also condensing the information into a concise
    and easy-to-understand format. Please ensure that the summary includes
    relevant details and examples that support the main ideas, while avoiding
    any unnecessary information or repetition.
  delete_file_button_enabled: true
  delete_all_files_button_enabled: true

llm:
  mode: llamacpp
  prompt_style: "llama3"
  # Should be matching the selected model
  max_new_tokens: 512
  context_window: 3900
  # Select your tokenizer. Llama-index tokenizer is the default.
  # tokenizer: meta-llama/Meta-Llama-3.1-8B-Instruct
  temperature: 0.1      # The temperature of the model. Increasing the temperature will make the model answer more creatively. A value of 0.1 would be more factual. (Default: 0.1)

rag:
  similarity_top_k: 2
  #This value controls how many "top" documents the RAG returns to use in the context.
  #similarity_value: 0.45
  #This value is disabled by default.  If you enable this settings, the RAG will only use articles that meet a certain percentage score.
  rerank:
    enabled: false
    mode: HybridSearchReranker

summarize:
  use_async: true

clickhouse:
    host: localhost
    port: 8443
    username: admin
    password: clickhouse
    database: embeddings

llamacpp:
  llm_hf_repo_id: lmstudio-community/Meta-Llama-3.1-8B-Instruct-GGUF
  llm_hf_model_file: Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf
  tfs_z: 1.0            # Tail free sampling is used to reduce the impact of less probable tokens from the output. A higher value (e.g., 2.0) will reduce the impact more, while a value of 1.0 disables this setting
  top_k: 40             # Reduces the probability of generating nonsense. A higher value (e.g. 100) will give more diverse answers, while a lower value (e.g. 10) will be more conservative. (Default: 40)
  top_p: 1.0            # Works together with top-k. A higher value (e.g., 0.95) will lead to more diverse text, while a lower value (e.g., 0.5) will generate more focused and conservative text. (Default: 0.9)
  repeat_penalty: 1.1   # Sets how strongly to penalize repetitions. A higher value (e.g., 1.5) will penalize repetitions more strongly, while a lower value (e.g., 0.9) will be more lenient. (Default: 1.1)

embedding:
  # Should be matching the value above in most cases
  mode: huggingface
  ingest_mode: asyncparallel
  embed_dim: 768 # 768 is for nomic-ai/nomic-embed-text-v1.5

huggingface:
  embedding_hf_model_name: nomic-ai/nomic-embed-text-v1.5
  access_token: ${HF_TOKEN:}
  # Warning: Enabling this option will allow the model to download and execute code from the internet.
  # Nomic AI requires this option to be enabled to use the model, be aware if you are using a different model.
  trust_remote_code: true

vectorstore:
  database: qdrant

nodestore:
  database: simple

milvus:
  uri: local_data/private_gpt/milvus/milvus_local.db
  collection_name: milvus_db
  overwrite: false

# qdrant:
#   path: local_data/private_gpt/qdrant

qdrant:
  async_mode: true
  container_name: robertqdrant
  port: 6333
  collection_name: test4
  parallel: 10
  enable_hybird: true
  similarity_top_k: 2
  sparse_top_k: 12 
  batch_size: 64 
  # fastembed_sparse_model: nomic-ai/nomic-embed-text-v1.5
  # sparse_doc_fn:  nomic-ai/nomic-embed-text-v1.5
  # sparse_query_fn : nomic-ai/nomic-embed-text-v1.5
  # hybrid_doc_fn: nomic-ai/nomic-embed-text-v1.5

postgres:
  host: localhost
  port: 5432
  database: postgres
  user: postgres
  password: postgres
  schema_name: private_gpt

sagemaker:
  llm_endpoint_name: huggingface-pytorch-tgi-inference-2023-09-25-19-53-32-140
  embedding_endpoint_name: huggingface-pytorch-inference-2023-11-03-07-41-36-479

openai:
  api_key: ${OPENAI_API_KEY:}
  model: gpt-3.5-turbo
  embedding_api_key: ${OPENAI_API_KEY:}

ollama:
  llm_model: llama3.1
  embedding_model: nomic-embed-text
  api_base: http://localhost:11434
  embedding_api_base: http://localhost:11434  # change if your embedding model runs on another ollama
  keep_alive: 5m
  request_timeout: 120.0
  autopull_models: true

azopenai:
  api_key: ${AZ_OPENAI_API_KEY:}
  azure_endpoint: ${AZ_OPENAI_ENDPOINT:}
  embedding_deployment_name: ${AZ_OPENAI_EMBEDDING_DEPLOYMENT_NAME:}
  llm_deployment_name: ${AZ_OPENAI_LLM_DEPLOYMENT_NAME:}
  api_version: "2023-05-15"
  embedding_model: text-embedding-ada-002
  llm_model: gpt-35-turbo

gemini:
  api_key: ${GOOGLE_API_KEY:}
  model: models/gemini-pro
  embedding_model: models/embedding-001

parse:
  name: llamaparse
  api_key: ${LLAMAPARSE_API_KEY:}
  async_mode: true
  enable_parsing_instruction: False
  parsing_instruction: |
    Prompt zur Dokumentenverarbeitung:

    Bitte parsen Sie das technische Dokument, das als Spezifikation für Projekte der Firma IGZ dient. Die Inhalte beziehen sich hauptsächlich auf SAP und enthalten wichtige Details zu Projektspezifikationen.

    Das Dokument weist folgende Merkmale auf:

    Multimedia-Inhalte: Es enthält zahlreiche Bilder, Tabellen, Listen und weitere Elemente, die wesentliche Informationen vermitteln.
    Abschnitte mit geringer Textmenge: Einige Abschnitte bestehen aus wenig Text und werden durch Bilder, Grafiken oder Listen illustriert, um Konzepte zu verdeutlichen.
    Aufgabe:

    Strukturierte Parsung nach Inhaltselementen:
    Parsen Sie das Dokument nach Absätzen, Tabellen, Listen und anderen Inhaltstypen.
    Wenn ein Absatz, eine Tabelle, eine Liste oder ein anderes Inhaltselement über zwei oder mehr Seiten verteilt ist, fassen Sie dieses Element zusammen und behandeln Sie es als eine Einheit.
    Sinnvolles Erfassen: Stellen Sie sicher, dass alle relevanten Informationen des Dokuments sinnvoll erfasst werden.
    Integrieren von Medien und Strukturelementen:
    Berücksichtigen Sie Bilder, Tabellen, Listen und andere visuelle oder strukturelle Elemente und integrieren Sie diese angemessen in die geparsten Daten.
    Falls das Dokument Bilder von Flussdiagrammen enthält, beschreiben Sie diese Bilder detailliert.
    Erhaltung der Kontextbezüge: Bewahren Sie die Beziehungen zwischen Text, Listen und visuellen Elementen, um das Verständnis der Spezifikationen zu gewährleisten.
    Ausschluss von Fußnoten: Fußnoten sollen nicht für jede Seite einzeln geparst werden.
    Hinweise:

    Achten Sie darauf, dass keine wichtigen Informationen verloren gehen, insbesondere bei Inhalten, die über mehrere Seiten verteilt sind oder spezielle Formatierungen aufweisen.
    Die Originalstruktur und der Kontext des Dokuments sollten in den geparsten Daten reflektiert werden.
    Bei der Verarbeitung von Tabellen, Absätzen, Listen oder anderen Elementen, die auf mehrere Seiten verteilt sind, kombinieren Sie diese zu einem vollständigen Element.
    Listen sollten korrekt erkannt und ihre Hierarchie (z. B. Aufzählungslisten, nummerierte Listen, verschachtelte Listen) erhalten bleiben.
    Fußnoten sollten gesammelt und am Ende des Dokuments eingefügt werden, anstatt sie auf jeder Seite separat zu parsen.