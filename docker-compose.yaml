services:
  robertcore:
    build:
      context: .
      dockerfile: Dockerfile.openai
    # image: logmangptcore_saved:v1.0
    container_name: robertcore
    volumes:
      - ./pdfs:/home/worker/app/pdfs
    ports:
      - "8001:8081"
    env_file:
      - .env
    environment:
      PORT: 8081
    networks:
      - robertnetwork

  robertqdrant:
    image: qdrant/qdrant:latest
    restart: always
    container_name: robertqdrant
    ports:
      - 6333:6333
      - 6334:6334
    expose:
      - 6333
      - 6334
      - 6335
    volumes:
      - ./qdrant_data:/qdrant/storage
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    networks:
      - robertnetwork
  
configs:
  qdrant_config:
    content: |
      log_level: INFO
  
networks:
  robertnetwork:
    driver: bridge